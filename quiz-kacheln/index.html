* { box-sizing: border-box; }

.tile { font: inherit; color: #fff; background: rgba(20,20,20,.92); border: 1px solid var(--line-2); border-radius: 14px; padding: 24px 12px 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; transition: border-color .15s, background .15s, transform .12s; min-width: 0; }

.grid.scale .tile.sel { background: var(--green-item); border-color: var(--green); }
.scale-wrap { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 10px; }

.start-tiles div { background: rgba(20,20,20,.9); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 14px; color: rgba(255,255,255,.85); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.start-tiles svg { width: 24px; height: 24px; color: var(--green); }

.test { width: 100%; max-width: 520px; text-align: left; font-size: 13px; color: var(--meta); background: #0b0b0b; border: 1px dashed var(--line-2); border-radius: 10px; padding: 14px 16px; }

.segs i { background: rgba(76,51,51,.14); } .segs i.on { background: var(--cocoa); } .segs i.now { background: linear-gradient(90deg, var(--cocoa) 50%, rgba(76,51,51,.14) 50%); }

button:focus-visible { outline-color: var(--cocoa); }
.start-tiles div { background: var(--surface); border-color: var(--line); color: var(--ink2); }
